<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>IguanaLab | Trampas IoT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --monster:#39FF14;
  --monster-dark:#2ecc0f;
  --text:#ffffff;
  --muted:rgba(255,255,255,.75);
  --shadow:0 12px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#ffffff;
  font-family:system-ui,sans-serif;
  padding:20px;
}

/* HEADER */
header{display:flex;justify-content:center;margin-bottom:28px}
header img.logo{height:110px}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

/* CARD */
.card{
  position:relative;
  background:var(--monster-dark);
  border-radius:18px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:var(--shadow);
}

/* TOP ICONS */
.top-icons{
  position:absolute;
  top:14px;
  right:14px;
  display:flex;
  gap:8px;
  align-items:center;
}

/* WIFI */
.wifi{
  position:relative;
  width:18px;
  height:14px;
}
.wifi span{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  border:2px solid transparent;
  border-top-color:#fff;
  border-radius:50%;
  opacity:.35;
}
.wifi span:nth-child(1){width:6px;height:6px;opacity:1}
.wifi span:nth-child(2){width:12px;height:12px}
.wifi span:nth-child(3){width:18px;height:18px}
.wifi.level-3 span{opacity:1}

/* TITULOS */
h2{color:#fff;font-size:1rem}

/* PREVIEW */
.preview{
  background:rgba(0,0,0,.15);
  border-radius:14px;
  height:180px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:.75rem;
  gap:6px;
  color:var(--muted);
  overflow:hidden;
}

/* CONTROLES */
.controls{
  display:flex;
  gap:10px;
}
.controls button{
  flex:1;
  font-size:.8rem;
  background:#ffffff;
  border:none;
  color:#000;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
}

/* SETTINGS */
.settings{
  display:none;
  background:rgba(0,0,0,.18);
  border-radius:12px;
  padding:10px;
  font-size:.7rem;
  gap:6px;
}
.settings.active{display:grid}

.settings label{
  display:flex;
  flex-direction:column;
  gap:4px;
  color:#fff;
}

/* HISTORIAL */
.history{font-size:.7rem;color:var(--muted)}
</style>
</head>

<body>

<header>
  <img src="logo.png" class="logo">
</header>

<section class="grid" id="grid"></section>

<script>
/* ================= CONFIGURACIÓN ================= */
const TOTAL_TRAPS = 3;
const CAMERA_LIVE_DURATION = 20000;

/* ================= ESP32-CAM ================= */
/* ⚠️ CAMBIA SOLO ESTA IP SI ES NECESARIO */
const CAM_IP = "10.38.40.178";
const STREAM_URL  = `http://${CAM_IP}:81/stream`;
const CAPTURE_URL = `http://${CAM_IP}:81/capture.jpg`;

/* ================= GENERAR TARJETAS ================= */
const grid = document.getElementById("grid");

for(let i=1;i<=TOTAL_TRAPS;i++){
  const card = document.createElement("div");
  card.className="card";

  card.innerHTML = `
    <div class="top-icons">
      <div class="wifi level-3">
        <span></span><span></span><span></span>
      </div>
    </div>

    <h2>Trampa #${i}</h2>

    <div class="preview" id="preview${i}">
      <b>Última captura</b>
      <img id="capture${i}"
           src="${CAPTURE_URL}?t=${Date.now()}"
           style="width:100%;border-radius:10px;margin-top:6px">
    </div>

    <div class="controls">
      <button id="cam${i}">📡 Cámara en vivo</button>
      <button id="set${i}">⚙️ Ajustes</button>
    </div>

    <div class="settings" id="settings${i}">
      <label>Zoom
        <input type="range" min="1" max="2" step="0.01" value="1">
      </label>
      <label>Brillo
        <input type="range" min="0.5" max="1.5" step="0.01" value="1">
      </label>
      <label>Contraste
        <input type="range" min="0.5" max="1.5" step="0.01" value="1">
      </label>
    </div>

    <div class="history">Último evento: Hace minutos</div>
  `;

  grid.appendChild(card);

  const preview  = card.querySelector(`#preview${i}`);
  const camBtn   = card.querySelector(`#cam${i}`);
  const settings = card.querySelector(`#settings${i}`);
  const sliders  = settings.querySelectorAll("input");

  function applyFilters(img){
    const [z,b,c] = sliders;
    img.style.transform = `scale(${z.value})`;
    img.style.filter = `brightness(${b.value}) contrast(${c.value})`;
  }

  sliders.forEach(sl=>{
    sl.oninput = ()=>{
      const img = preview.querySelector("img");
      if(img) applyFilters(img);
    };
  });

  camBtn.onclick = ()=>{
    let s = CAMERA_LIVE_DURATION / 1000;

    preview.innerHTML = `
      <b>📡 Cámara en vivo</b>
      <img src="${STREAM_URL}"
           style="width:100%;border-radius:10px;margin-top:6px">
      <span>${s}s</span>
    `;

    const img = preview.querySelector("img");
    applyFilters(img);

    const t = setInterval(()=>{
      s--;
      preview.querySelector("span").textContent = `${s}s`;
    },1000);

    setTimeout(()=>{
      clearInterval(t);
      preview.innerHTML = `
        <b>Última captura</b>
        <img src="${CAPTURE_URL}?t=${Date.now()}"
             style="width:100%;border-radius:10px;margin-top:6px">
      `;
      applyFilters(preview.querySelector("img"));
    }, CAMERA_LIVE_DURATION);
  };

  card.querySelector(`#set${i}`).onclick = ()=>{
    settings.classList.toggle("active");
  };
}
</script>

</body>
</html>
