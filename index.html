<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>IguanaLab | Trampas IoT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --monster:#39FF14;
  --monster-dark:#2ecc0f;
  --text:#ffffff;
  --muted:rgba(255,255,255,.75);
  --shadow:0 12px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#ffffff;
  font-family:system-ui,sans-serif;
  padding:20px;
}

/* HEADER */
header{display:flex;justify-content:center;margin-bottom:28px}
header img.logo{height:110px}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

/* CARD */
.card{
  position:relative;
  background:var(--monster-dark);
  border-radius:18px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:var(--shadow);
  transition:.2s;
}
.card.disabled{
  opacity:.45;
  filter:grayscale(1);
}

/* TOP ICONS */
.top-icons{
  position:absolute;
  top:14px;
  right:14px;
  display:flex;
  gap:8px;
  align-items:center;
}

/* MODULE TOGGLE */
.module-toggle{
  width:14px;
  height:14px;
  border-radius:50%;
  background:#ffffff;
  cursor:pointer;
  box-shadow:0 0 0 2px rgba(0,0,0,.25);
}
.module-toggle.off{
  background:rgba(255,255,255,.25);
}

/* WIFI */
.wifi{
  position:relative;
  width:18px;
  height:14px;
}
.wifi span{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  border:2px solid transparent;
  border-top-color:#fff;
  border-radius:50%;
  opacity:.35;
}
.wifi span:nth-child(1){width:6px;height:6px;opacity:1}
.wifi span:nth-child(2){width:12px;height:12px}
.wifi span:nth-child(3){width:18px;height:18px}
.wifi.level-3 span{opacity:1}

/* TITULOS */
h2{color:#fff;font-size:1rem}

/* PREVIEW */
.preview{
  background:rgba(0,0,0,.15);
  border-radius:14px;
  height:140px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:.75rem;
  gap:6px;
  color:var(--muted);
}

/* CONTROLES */
.controls{
  display:flex;
  gap:10px;
}
.controls button{
  flex:1;
  font-size:.8rem;
  background:#ffffff;
  border:none;
  color:#000;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
}
.controls button:disabled{
  background:rgba(255,255,255,.4);
  cursor:not-allowed;
}

/* SETTINGS */
.settings{
  display:none;
  background:rgba(0,0,0,.18);
  border-radius:12px;
  padding:10px;
  font-size:.7rem;
}
.settings.active{display:grid}

/* HISTORIAL */
.history{font-size:.7rem;color:var(--muted)}
</style>
</head>

<body>

<header>
  <img src="logo.png" class="logo">
</header>

<section class="grid" id="grid"></section>

<script>
const TOTAL_TRAPS = 3;

/* ================= PERSISTENCIA ================= */
function moduleKey(id){
  return `module_enabled_${id}`;
}
function isEnabled(id){
  const v = localStorage.getItem(moduleKey(id));
  return v === null ? true : v === "true";
}
function setEnabled(id,val){
  localStorage.setItem(moduleKey(id), val);
}

/* ================= GENERAR TARJETAS ================= */
const grid = document.getElementById("grid");

for(let i=1;i<=TOTAL_TRAPS;i++){
  const card = document.createElement("div");
  card.className="card";

  card.innerHTML = `
    <div class="top-icons">
      <div class="wifi level-3">
        <span></span><span></span><span></span>
      </div>
      <div class="module-toggle" id="toggle${i}"></div>
    </div>

    <h2>Trampa #${i}</h2>

    <div class="preview">
      <b>Última captura</b>
      <span>Sin imagen</span>
    </div>

    <div class="controls">
      <button>📷 Cámara</button>
      <button onclick="toggleSettings(${i})">⚙️ Ajustes</button>
    </div>

    <div class="settings" id="settings${i}">
      <label>Zoom <input type="range"></label>
      <label>Brillo <input type="range"></label>
      <label>Contraste <input type="range"></label>
    </div>

    <div class="history">Último evento: Hace minutos</div>
  `;

  grid.appendChild(card);

  const toggle = card.querySelector(`#toggle${i}`);
  const buttons = card.querySelectorAll("button");

  function applyState(){
    const enabled = isEnabled(i);
    toggle.classList.toggle("off", !enabled);
    card.classList.toggle("disabled", !enabled);
    buttons.forEach(b=>b.disabled=!enabled);
  }

  toggle.onclick = ()=>{
    setEnabled(i, !isEnabled(i));
    applyState();
  };

  applyState();
}

/* ================= AJUSTES ================= */
function toggleSettings(i){
  document.getElementById("settings"+i).classList.toggle("active");
}
</script>

</body>
</html>
