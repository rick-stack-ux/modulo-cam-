<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>IguanaLab | Trampas IoT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ================= IDENTIDAD MONSTER ================= */
:root{
  --monster:#39FF14;
  --monster-dark:#2ecc0f;
  --text:#ffffff;
  --muted:rgba(255,255,255,.75);
  --shadow:0 12px 28px rgba(0,0,0,.35);
}

/* ================= BASE ================= */
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  font-family:system-ui, sans-serif;
  background:#ffffff;
  color:var(--text);
  padding:20px;
}

/* HEADER */
header{
  display:flex;
  justify-content:center;
  margin-bottom:28px;
}
header img.logo{height:110px}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

/* CARD */
.card{
  position:relative;
  background:var(--monster-dark);
  border-radius:18px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:var(--shadow);
}

/* TOP ICONS */
.top-icons{
  position:absolute;
  top:14px;
  right:14px;
}

/* WIFI */
.wifi{
  position:relative;
  width:18px;
  height:14px;
}
.wifi span{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  border:2px solid transparent;
  border-top-color:#fff;
  border-radius:50%;
  opacity:.35;
}
.wifi span:nth-child(1){width:6px;height:6px;opacity:1}
.wifi span:nth-child(2){width:12px;height:12px}
.wifi span:nth-child(3){width:18px;height:18px}
.wifi.level-3 span{opacity:1}

/* TITULOS */
h2{
  color:#fff;
  font-size:1rem;
}

/* PREVIEW */
.preview{
  background:rgba(0,0,0,.15);
  border-radius:14px;
  height:140px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:.75rem;
  gap:6px;
  text-align:center;
  color:var(--muted);
}

/* CONTROLES */
.controls{
  display:flex;
  gap:10px;
}
.controls button{
  flex:1;
  font-size:.8rem;
  background:#ffffff;
  border:none;
  color:#000;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
  transition:.2s;
}
.controls button:disabled{
  background:rgba(255,255,255,.4);
  color:#555;
  cursor:not-allowed;
}
.controls button:last-child{
  background:rgba(0,0,0,.25);
  color:#fff;
}
.controls button:hover:not(:disabled){
  transform:translateY(-1px);
  box-shadow:0 6px 14px rgba(0,0,0,.25);
}

/* SETTINGS */
.settings{
  display:none;
  background:rgba(0,0,0,.18);
  border-radius:12px;
  padding:10px;
  font-size:.7rem;
  gap:6px;
}
.settings.active{display:grid}
.settings label{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
}

/* HISTORIAL */
.history{
  font-size:.7rem;
  color:var(--muted);
}
</style>
</head>

<body>

<header>
  <img src="logo.png" class="logo">
</header>

<section class="grid" id="grid"></section>

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const CAMERA_DAILY_LIMIT = 2;
const CAMERA_LIVE_DURATION = 20000;
const TOTAL_TRAPS = 3;

/* ============================================================
   UTILIDADES DE FECHA
   ============================================================ */
function today(){
  return new Date().toISOString().slice(0,10);
}
function key(trap){
  return `camera_trap_${trap}_${today()}`;
}
function getViews(trap){
  return parseInt(localStorage.getItem(key(trap))) || 0;
}
function addView(trap){
  localStorage.setItem(key(trap), getViews(trap) + 1);
}

/* ============================================================
   CÁMARA EN VIVO (POR TRAMPA)
   ============================================================ */
function openLiveCamera(trap, preview, btn){
  if(getViews(trap) >= CAMERA_DAILY_LIMIT){
    btn.disabled = true;
    btn.textContent = "Bloqueado hoy";
    return;
  }

  addView(trap);

  if(getViews(trap) >= CAMERA_DAILY_LIMIT){
    btn.disabled = true;
    btn.textContent = "Bloqueado hoy";
  }

  const original = preview.innerHTML;
  let s = CAMERA_LIVE_DURATION / 1000;

  preview.innerHTML = `<b>📡 Cámara en vivo</b><span>${s}s</span>`;

  const timer = setInterval(()=>{
    s--;
    preview.querySelector("span").textContent = `${s}s`;
  },1000);

  setTimeout(()=>{
    clearInterval(timer);
    preview.innerHTML = original;
  }, CAMERA_LIVE_DURATION);
}

/* ============================================================
   GENERAR TARJETAS
   ============================================================ */
const grid = document.getElementById("grid");

for(let i=1;i<=TOTAL_TRAPS;i++){
  const card = document.createElement("div");
  card.className="card";

  card.innerHTML = `
    <div class="top-icons">
      <div class="wifi level-3">
        <span></span><span></span><span></span>
      </div>
    </div>

    <h2>Trampa #${i}</h2>

    <div class="preview">
      <b>Última captura</b>
      <span>Sin imagen</span>
    </div>

    <div class="controls">
      <button id="camBtn${i}">📷 Cámara</button>
      <button onclick="toggleSettings(${i})">⚙️ Ajustes</button>
    </div>

    <div class="settings" id="settings${i}">
      <label>Zoom <input type="range"></label>
      <label>Brillo <input type="range"></label>
      <label>Contraste <input type="range"></label>
    </div>

    <div class="history">Último evento: Hace minutos</div>
  `;

  grid.appendChild(card);

  const btn = document.getElementById(`camBtn${i}`);
  const preview = card.querySelector(".preview");

  // Estado inicial (persistente)
  if(getViews(i) >= CAMERA_DAILY_LIMIT){
    btn.disabled = true;
    btn.textContent = "Bloqueado hoy";
  }

  btn.onclick = ()=>openLiveCamera(i, preview, btn);
}

/* ============================================================
   AJUSTES
   ============================================================ */
function toggleSettings(i){
  document.getElementById("settings"+i).classList.toggle("active");
}
</script>

</body>
</html>
