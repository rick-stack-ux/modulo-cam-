<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>IguanaLab | Trampas IoT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --monster:#39FF14;
  --monster-dark:#2ecc0f;
  --text:#ffffff;
  --muted:rgba(255,255,255,.75);
  --shadow:0 12px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#ffffff;
  font-family:system-ui,sans-serif;
  padding:20px;
}

header{display:flex;justify-content:center;margin-bottom:28px}
header img.logo{height:110px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.card{
  position:relative;
  background:var(--monster-dark);
  border-radius:18px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:var(--shadow);
}
.card.disabled{
  opacity:.45;
  filter:grayscale(1);
}

.top-icons{
  position:absolute;
  top:14px;
  right:14px;
  display:flex;
  gap:8px;
  align-items:center;
}

.module-toggle{
  width:14px;
  height:14px;
  border-radius:50%;
  background:#ffffff;
  cursor:pointer;
  box-shadow:0 0 0 2px rgba(0,0,0,.25);
}
.module-toggle.off{
  background:rgba(255,255,255,.25);
}

.wifi{
  position:relative;
  width:18px;
  height:14px;
}
.wifi span{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  border:2px solid transparent;
  border-top-color:#fff;
  border-radius:50%;
  opacity:.35;
}
.wifi span:nth-child(1){width:6px;height:6px;opacity:1}
.wifi span:nth-child(2){width:12px;height:12px}
.wifi span:nth-child(3){width:18px;height:18px}
.wifi.level-3 span{opacity:1}

h2{color:#fff;font-size:1rem}

.preview{
  background:rgba(0,0,0,.15);
  border-radius:14px;
  height:160px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:.75rem;
  gap:6px;
  color:var(--muted);
  overflow:hidden;
}

.controls{
  display:flex;
  gap:10px;
}
.controls button{
  flex:1;
  font-size:.8rem;
  background:#ffffff;
  border:none;
  color:#000;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
}
.controls button:disabled{
  background:rgba(255,255,255,.4);
  cursor:not-allowed;
}

.settings{
  display:none;
  background:rgba(0,0,0,.18);
  border-radius:12px;
  padding:10px;
  font-size:.7rem;
}
.settings.active{display:grid}

.history{font-size:.7rem;color:var(--muted)}
</style>
</head>

<body>

<header>
  <img src="logo.png" class="logo">
</header>

<section class="grid" id="grid"></section>

<script>
/* ================= CONFIG ================= */
const TOTAL_TRAPS = 3;
const CAMERA_LIVE_DURATION = 20000;
const CAMERA_DAILY_LIMIT = 2;

/* ===== IP DE TU ESP32 PRINCIPAL ===== */
const MAIN_ESP_BASE = "http://10.153.210.142";   // ← TU IP REAL
const STREAM_URL = MAIN_ESP_BASE + "/stream";
const LAST_IMAGE_URL = MAIN_ESP_BASE + "/last.jpg";

/* ===== FIREBASE ===== */
const FIREBASE_DB = "https://t-sonda-2-default-rtdb.firebaseio.com";

/* ================= FECHA ================= */
function today(){
  return new Date().toISOString().slice(0,10);
}

/* ================= CLAVES ================= */
function moduleKey(id){ return `module_enabled_${id}`; }
function cameraKey(id){ return `camera_views_${id}_${today()}`; }

/* ================= ESTADOS ================= */
function isEnabled(id){
  const v = localStorage.getItem(moduleKey(id));
  return v === null ? true : v === "true";
}
function setEnabled(id,val){
  localStorage.setItem(moduleKey(id), val);
}
function getViews(id){
  return parseInt(localStorage.getItem(cameraKey(id))) || 0;
}
function addView(id){
  localStorage.setItem(cameraKey(id), getViews(id)+1);
}

/* ================= FIREBASE ================= */
async function getTrapState(id){
  const res = await fetch(`${FIREBASE_DB}/traps/${id}.json`);
  return await res.json();
}

function sendCommand(id, cmd){
  fetch(`${FIREBASE_DB}/traps/${id}/command.json`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(cmd)
  });
}

/* ================= CÁMARA EN VIVO ================= */
async function openLiveCamera(id, preview){
  if(id !== 1) return;
  if(!isEnabled(id)) return;

  const state = await getTrapState(id);
  if(state.online !== true){
    alert("Trampa dormida. Espere próximo evento.");
    return;
  }

  if(getViews(id) >= CAMERA_DAILY_LIMIT){
    alert("Límite diario de cámara alcanzado");
    return;
  }

  addView(id);
  sendCommand(id, "STREAM");

  let s = CAMERA_LIVE_DURATION / 1000;

  preview.innerHTML = `
    <b>📡 Cámara en vivo</b>
    <img src="${STREAM_URL}?t=${Date.now()}"
         style="width:100%;border-radius:10px;margin-top:6px">
    <span>${s}s</span>
  `;

  const t = setInterval(()=>{
    s--;
    preview.querySelector("span").textContent = `${s}s`;
  },1000);

  setTimeout(()=>{
    clearInterval(t);
    preview.innerHTML = `
      <b>Última captura</b>
      <img src="${LAST_IMAGE_URL}?t=${Date.now()}"
           style="width:100%;border-radius:10px;margin-top:6px">
    `;
  }, CAMERA_LIVE_DURATION);
}

/* ================= GENERAR TARJETAS ================= */
const grid = document.getElementById("grid");

for(let i=1;i<=TOTAL_TRAPS;i++){
  const card = document.createElement("div");
  card.className="card";

  card.innerHTML = `
    <div class="top-icons">
      <div class="wifi level-3">
        <span></span><span></span><span></span>
      </div>
      <div class="module-toggle" id="toggle${i}"></div>
    </div>

    <h2>Trampa #${i}</h2>

    <div class="preview" id="preview${i}">
      <b>Última captura</b>
      <span>Sin imagen</span>
    </div>

    <div class="controls">
      <button id="cam${i}">📡 Cámara en vivo</button>
      <button id="set${i}">⚙️ Ajustes</button>
    </div>

    <div class="settings" id="settings${i}">
      <label>Zoom <input type="range"></label>
      <label>Brillo <input type="range"></label>
      <label>Contraste <input type="range"></label>
    </div>

    <div class="history">Estado sincronizado con Firebase</div>
  `;

  grid.appendChild(card);

  const toggle = card.querySelector(`#toggle${i}`);
  const camBtn = card.querySelector(`#cam${i}`);
  const setBtn = card.querySelector(`#set${i}`);
  const preview = card.querySelector(`#preview${i}`);

  function applyState(){
    const en = isEnabled(i);
    toggle.classList.toggle("off", !en);
    card.classList.toggle("disabled", !en);
    camBtn.disabled = !en || i !== 1;
    setBtn.disabled = !en;
  }

  toggle.onclick = ()=>{
    const newState = !isEnabled(i);
    setEnabled(i, newState);
    sendCommand(i, newState ? "ENABLE" : "DISABLE");
    applyState();
  };

  camBtn.onclick = ()=> openLiveCamera(i, preview);
  setBtn.onclick = ()=> document.getElementById("settings"+i).classList.toggle("active");

  applyState();
}

/* ================= CARGA INICIAL DE IMAGEN ================= */
window.onload = async ()=>{
  const preview1 = document.getElementById("preview1");
  if(!preview1) return;

  try{
    const state = await getTrapState(1);

    if(state.online === true && state.lastCapture === "OK"){
      preview1.innerHTML = `
        <b>Última captura</b>
        <img src="${LAST_IMAGE_URL}?t=${Date.now()}"
             style="width:100%;border-radius:10px;margin-top:6px">
      `;
    }else{
      preview1.innerHTML = `
        <b>Última captura</b>
        <span>ESP32 dormido</span>
      `;
    }
  }catch(e){
    preview1.innerHTML = `
      <b>Última captura</b>
      <span>Sin conexión</span>
    `;
  }
};
</script>

</body>
</html>
