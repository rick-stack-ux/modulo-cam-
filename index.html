<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>IguanaLab | Trampas IoT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --monster:#39FF14;
  --monster-dark:#2ecc0f;
  --text:#ffffff;
  --muted:rgba(255,255,255,.75);
  --shadow:0 12px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#ffffff;
  font-family:system-ui,sans-serif;
  padding:20px;
}

header{display:flex;justify-content:center;margin-bottom:28px}
header img.logo{height:110px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.card{
  position:relative;
  background:var(--monster-dark);
  border-radius:18px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:var(--shadow);
}
.card.disabled{
  opacity:.45;
  filter:grayscale(1);
}

.top-icons{
  position:absolute;
  top:14px;
  right:14px;
  display:flex;
  gap:8px;
  align-items:center;
}

/* ===== TOGGLE ORIGINAL ===== */
.module-toggle{
  width:14px;
  height:14px;
  border-radius:50%;
  background:#ffffff;
  cursor:pointer;
  box-shadow:0 0 0 2px rgba(0,0,0,.25);
}
.module-toggle.off{
  background:rgba(255,255,255,.25);
}

/* ===== WIFI ORIGINAL ===== */
.wifi{
  position:relative;
  width:18px;
  height:14px;
}
.wifi span{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  border:2px solid transparent;
  border-top-color:#fff;
  border-radius:50%;
  opacity:.35;
}
.wifi span:nth-child(1){width:6px;height:6px;opacity:1}
.wifi span:nth-child(2){width:12px;height:12px}
.wifi span:nth-child(3){width:18px;height:18px}
.wifi.level-3 span{opacity:1}

h2{color:#fff;font-size:1rem}

/* ===== PREVIEW MISMO TAMAÑO PERO MEJOR PROPORCIÓN ===== */
.preview{
  background:rgba(0,0,0,.15);
  border-radius:14px;
  height:200px;                 /* un poco más alto */
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:.75rem;
  gap:6px;
  color:var(--muted);
  overflow:hidden;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:contain;
  transition:.2s;
}

.controls{
  display:flex;
  gap:10px;
}
.controls button{
  flex:1;
  font-size:.8rem;
  background:#ffffff;
  border:none;
  color:#000;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
}
.controls button:disabled{
  background:rgba(255,255,255,.4);
  cursor:not-allowed;
}

.settings{
  display:none;
  background:rgba(0,0,0,.18);
  border-radius:12px;
  padding:10px;
  font-size:.7rem;
  color:#fff;
}
.settings.active{display:grid}
.settings label{display:flex;justify-content:space-between;align-items:center}

.history{font-size:.7rem;color:var(--muted)}
</style>
</head>

<body>

<header>
  <img src="logo.png" class="logo">
</header>

<section class="grid" id="grid"></section>

<script>
/* ================= CONFIG ================= */
const TOTAL_TRAPS = 3;
const CAMERA_LIVE_DURATION = 20000;

/* ===== IP ESP32 ===== */
const MAIN_ESP_BASE = "http://10.153.210.142";
const STREAM_URL = MAIN_ESP_BASE + "/stream";
const LAST_IMAGE_URL = MAIN_ESP_BASE + "/last.jpg";

/* ===== FIREBASE ===== */
const FIREBASE_DB = "https://t-sonda-2-default-rtdb.firebaseio.com";

/* ================= ESTADOS LOCALES ================= */
function moduleKey(id){ return `module_enabled_${id}`; }
function isEnabled(id){
  const v = localStorage.getItem(moduleKey(id));
  return v === null ? true : v === "true";
}
function setEnabled(id,val){
  localStorage.setItem(moduleKey(id), val);
}

/* ================= FIREBASE ================= */
async function getTrapState(id){
  const res = await fetch(`${FIREBASE_DB}/traps/${id}.json`);
  return await res.json();
}

function sendCommand(id, cmd){
  fetch(`${FIREBASE_DB}/traps/${id}/command.json`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(cmd)
  });
}

/* ================= FILTROS ================= */
let zoom = 1;
let brightness = 1;
let contrast = 1;

function applyFilters(img){
  img.style.transform = `scale(${zoom})`;
  img.style.filter = `brightness(${brightness}) contrast(${contrast})`;
}

/* ================= STREAM ================= */
async function openLiveCamera(id, preview){
  const state = await getTrapState(id);
  if(state.online !== true){
    alert("Trampa dormida. Espere próximo evento.");
    return;
  }

  let s = CAMERA_LIVE_DURATION / 1000;

  preview.innerHTML = `
    <b>📡 Cámara en vivo</b>
    <img id="imgLive${id}" src="${STREAM_URL}?t=${Date.now()}">
    <span>${s}s</span>
  `;

  const img = document.getElementById(`imgLive${id}`);
  applyFilters(img);

  const t = setInterval(()=>{
    s--;
    preview.querySelector("span").textContent = `${s}s`;
  },1000);

  setTimeout(()=>{
    clearInterval(t);
    loadLastCapture(id, preview);
  }, CAMERA_LIVE_DURATION);
}

/* ================= ÚLTIMA CAPTURA PERSISTENTE ================= */
function loadLastCapture(id, preview){

  const saved = localStorage.getItem(`lastImage_${id}`);

  preview.innerHTML = `
    <b>Última captura</b>
    <img id="imgLast${id}" src="${saved ? saved : LAST_IMAGE_URL}?t=${Date.now()}">
  `;

  const img = document.getElementById(`imgLast${id}`);
  applyFilters(img);

  img.onload = ()=>{
    localStorage.setItem(`lastImage_${id}`, LAST_IMAGE_URL);
  };
}

/* ================= GENERAR TARJETAS (IGUAL QUE TU DISEÑO) ================= */
const grid = document.getElementById("grid");

for(let i=1;i<=TOTAL_TRAPS;i++){
  const card = document.createElement("div");
  card.className="card";

  card.innerHTML = `
    <div class="top-icons">
      <div class="wifi level-3" id="wifi${i}">
        <span></span><span></span><span></span>
      </div>
      <div class="module-toggle" id="toggle${i}"></div>
    </div>

    <h2>Trampa #${i}</h2>

    <div class="preview" id="preview${i}">
      <b>Última captura</b>
      <span>Sin imagen</span>
    </div>

    <div class="controls">
      <button id="cam${i}">📡 Cámara en vivo</button>
      <button id="set${i}">⚙️ Ajustes</button>
    </div>

    <div class="settings" id="settings${i}">
      <label>Zoom <input type="range" min="1" max="2" step="0.1" value="1"></label>
      <label>Brillo <input type="range" min="0.5" max="2" step="0.1" value="1"></label>
      <label>Contraste <input type="range" min="0.5" max="2" step="0.1" value="1"></label>
    </div>

    <div class="history">Estado sincronizado con Firebase</div>
  `;

  grid.appendChild(card);

  const toggle = card.querySelector(`#toggle${i}`);
  const camBtn = card.querySelector(`#cam${i}`);
  const setBtn = card.querySelector(`#set${i}`);
  const preview = card.querySelector(`#preview${i}`);
  const settings = card.querySelector(`#settings${i}`);

  /* ===== ESTADO TOGGLE PERSISTENTE ===== */
  function applyState(){
    const en = isEnabled(i);
    toggle.classList.toggle("off", !en);
    card.classList.toggle("disabled", !en);
    camBtn.disabled = !en || i !== 1;
    setBtn.disabled = !en;
  }

  toggle.onclick = ()=>{
    const newState = !isEnabled(i);
    setEnabled(i, newState);
    sendCommand(i, newState ? "ENABLE" : "DISABLE");
    applyState();
  };

  camBtn.onclick = ()=> openLiveCamera(i, preview);
  setBtn.onclick = ()=> settings.classList.toggle("active");

  /* ===== FILTROS POR TARJETA ===== */
  const sliders = settings.querySelectorAll("input");
  sliders[0].oninput = e=>{ zoom = e.target.value; const img=preview.querySelector("img"); if(img) applyFilters(img); };
  sliders[1].oninput = e=>{ brightness = e.target.value; const img=preview.querySelector("img"); if(img) applyFilters(img); };
  sliders[2].oninput = e=>{ contrast = e.target.value; const img=preview.querySelector("img"); if(img) applyFilters(img); };

  applyState();
}

/* ================= CARGA AL RECARGAR ================= */
window.onload = async ()=>{
  for(let i=1;i<=TOTAL_TRAPS;i++){
    const preview = document.getElementById(`preview${i}`);

    try{
      const state = await getTrapState(i);

      // wifi indicador según señal
      const wifi = document.getElementById(`wifi${i}`);
      if(state.wifi > -60) wifi.className="wifi level-3";
      else if(state.wifi > -75) wifi.className="wifi level-2";
      else wifi.className="wifi level-1";

      if(state.lastCapture === "OK"){
        loadLastCapture(i, preview);
      }
    }catch(e){
      // sin firebase → mostrar última guardada
      loadLastCapture(i, preview);
    }
  }
};
</script>

</body>
</html>
