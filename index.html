<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>IguanaLab | Trampas IoT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --monster:#39FF14;
  --monster-dark:#2ecc0f;
  --text:#ffffff;
  --muted:rgba(255,255,255,.75);
  --shadow:0 12px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#ffffff;
  font-family:system-ui,sans-serif;
  padding:20px;
}

header{display:flex;justify-content:center;margin-bottom:28px}
header img.logo{height:110px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.card{
  position:relative;
  background:var(--monster-dark);
  border-radius:18px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:var(--shadow);
}

.top-icons{
  position:absolute;
  top:14px;
  right:14px;
  display:flex;
  gap:8px;
}

h2{color:#fff;font-size:1rem}

/* ===== PREVIEW CUADRADO OPTIMIZADO ===== */
.preview{
  background:rgba(0,0,0,.15);
  border-radius:14px;
  width:100%;
  aspect-ratio:1 / 1;        /* CUADRADO */
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:.75rem;
  color:var(--muted);
  overflow:hidden;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:contain;       /* RESPETA PROPORCIÓN */
  filter:brightness(1) contrast(1);
  transition:.2s;
}

.controls{
  display:flex;
  gap:10px;
}
.controls button{
  flex:1;
  font-size:.8rem;
  background:#ffffff;
  border:none;
  color:#000;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
}

.settings{
  display:none;
  background:rgba(0,0,0,.18);
  border-radius:12px;
  padding:10px;
  font-size:.7rem;
  color:#fff;
}
.settings.active{display:grid}
.settings label{display:flex;justify-content:space-between;align-items:center}

.history{font-size:.7rem;color:var(--muted)}
</style>
</head>

<body>

<header>
  <img src="logo.png" class="logo">
</header>

<section class="grid" id="grid"></section>

<script>
/* ================= CONFIG ================= */
const TOTAL_TRAPS = 3;
const CAMERA_LIVE_DURATION = 20000;

/* ===== IP DE TU ESP32 PRINCIPAL ===== */
const MAIN_ESP_BASE = "http://10.153.210.142";
const STREAM_URL = MAIN_ESP_BASE + "/stream";
const LAST_IMAGE_URL = MAIN_ESP_BASE + "/last.jpg";

/* ===== FIREBASE ===== */
const FIREBASE_DB = "https://t-sonda-2-default-rtdb.firebaseio.com";

/* ================= FIREBASE ================= */
async function getTrapState(id){
  const res = await fetch(`${FIREBASE_DB}/traps/${id}.json`);
  return await res.json();
}

/* ================= FILTROS ================= */
let zoom = 1;
let brightness = 1;
let contrast = 1;

function applyFilters(img){
  img.style.transform = `scale(${zoom})`;
  img.style.filter = `brightness(${brightness}) contrast(${contrast})`;
}

/* ================= STREAM ================= */
async function openLiveCamera(id, preview){
  const state = await getTrapState(id);
  if(state.online !== true){
    alert("Trampa dormida. Espere próximo evento.");
    return;
  }

  let s = CAMERA_LIVE_DURATION / 1000;

  preview.innerHTML = `
    <b>📡 Cámara en vivo</b>
    <img id="imgLive" src="${STREAM_URL}?t=${Date.now()}">
    <span>${s}s</span>
  `;

  const img = document.getElementById("imgLive");
  applyFilters(img);

  const t = setInterval(()=>{
    s--;
    preview.querySelector("span").textContent = `${s}s`;
  },1000);

  setTimeout(()=>{
    clearInterval(t);
    loadLastCapture(preview);
  }, CAMERA_LIVE_DURATION);
}

/* ================= ÚLTIMA CAPTURA PERSISTENTE ================= */
function loadLastCapture(preview){

  const saved = localStorage.getItem("lastImage");

  preview.innerHTML = `
    <b>Última captura</b>
    <img id="imgLast" src="${saved ? saved : LAST_IMAGE_URL}?t=${Date.now()}">
  `;

  const img = document.getElementById("imgLast");
  applyFilters(img);

  // guardar imagen para recargas futuras
  img.onload = ()=>{
    localStorage.setItem("lastImage", LAST_IMAGE_URL);
  };
}

/* ================= GENERAR TARJETA ================= */
const grid = document.getElementById("grid");

const card = document.createElement("div");
card.className="card";

card.innerHTML = `
  <h2>Trampa #1</h2>

  <div class="preview" id="preview1">
    <b>Última captura</b>
    <span>Cargando...</span>
  </div>

  <div class="controls">
    <button id="cam1">📡 Cámara en vivo</button>
    <button id="set1">⚙️ Ajustes</button>
  </div>

  <div class="settings" id="settings1">
    <label>Zoom <input type="range" min="1" max="2" step="0.1" value="1" id="zoom"></label>
    <label>Brillo <input type="range" min="0.5" max="2" step="0.1" value="1" id="bright"></label>
    <label>Contraste <input type="range" min="0.5" max="2" step="0.1" value="1" id="cont"></label>
  </div>

  <div class="history">Última imagen persistente</div>
`;

grid.appendChild(card);

const preview = document.getElementById("preview1");
const camBtn = document.getElementById("cam1");
const setBtn = document.getElementById("set1");

/* ================= EVENTOS ================= */
camBtn.onclick = ()=> openLiveCamera(1, preview);
setBtn.onclick = ()=> document.getElementById("settings1").classList.toggle("active");

/* ===== CONTROLES DE FILTRO ===== */
document.getElementById("zoom").oninput = e=>{
  zoom = e.target.value;
  const img = preview.querySelector("img");
  if(img) applyFilters(img);
};

document.getElementById("bright").oninput = e=>{
  brightness = e.target.value;
  const img = preview.querySelector("img");
  if(img) applyFilters(img);
};

document.getElementById("cont").oninput = e=>{
  contrast = e.target.value;
  const img = preview.querySelector("img");
  if(img) applyFilters(img);
};

/* ================= CARGA AL ABRIR / RECARGAR ================= */
window.onload = async ()=>{
  try{
    const state = await getTrapState(1);

    if(state.lastCapture === "OK"){
      loadLastCapture(preview);
    }else{
      preview.innerHTML = `<b>Última captura</b><span>Sin imagen</span>`;
    }
  }catch(e){
    // aunque no haya conexión, mostrar última guardada
    loadLastCapture(preview);
  }
};
</script>

</body>
</html>
