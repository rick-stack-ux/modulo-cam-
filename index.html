<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>IguanaLab | Trampas IoT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --monster:#39FF14;
  --monster-dark:#2ecc0f;
  --text:#ffffff;
  --muted:rgba(255,255,255,.75);
  --shadow:0 12px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#ffffff;
  font-family:system-ui,sans-serif;
  padding:20px;
}

header{display:flex;justify-content:center;margin-bottom:28px}
header img.logo{height:110px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.card{
  position:relative;
  background:var(--monster-dark);
  border-radius:18px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:var(--shadow);
}
.card.disabled{
  opacity:.45;
  filter:grayscale(1);
}

.top-icons{
  position:absolute;
  top:14px;
  right:14px;
  display:flex;
  gap:8px;
  align-items:center;
}

.module-toggle{
  width:14px;
  height:14px;
  border-radius:50%;
  background:#ffffff;
  cursor:pointer;
  box-shadow:0 0 0 2px rgba(0,0,0,.25);
}
.module-toggle.off{
  background:rgba(255,255,255,.25);
}

.wifi{
  position:relative;
  width:18px;
  height:14px;
}
.wifi span{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  border:2px solid transparent;
  border-top-color:#fff;
  border-radius:50%;
  opacity:.35;
}
.wifi span:nth-child(1){width:6px;height:6px;opacity:1}
.wifi span:nth-child(2){width:12px;height:12px}
.wifi span:nth-child(3){width:18px;height:18px}
.wifi.level-3 span{opacity:1}

h2{color:#fff;font-size:1rem}

/* ===== PREVIEW EXACTO 4:3 + VISOR ===== */
.preview{
  position:relative;
  background:#000;
  border-radius:14px;
  width:100%;
  aspect-ratio:4 / 3;          /* PROPORCIÓN EXACTA QVGA */
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:.75rem;
  color:var(--muted);
  overflow:hidden;

  /* marco tipo visor */
  border:3px solid rgba(255,255,255,.25);
  box-shadow:
    inset 0 0 0 2px rgba(0,0,0,.6),
    0 0 0 1px rgba(0,0,0,.4);
}

/* imagen real sin deformar */
.preview img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* ===== OVERLAY DE HORA ===== */
.overlay-time{
  position:absolute;
  bottom:6px;
  right:8px;
  background:rgba(0,0,0,.6);
  color:#39FF14;
  font-size:.65rem;
  padding:3px 6px;
  border-radius:6px;
  font-family:monospace;
  letter-spacing:.5px;
}

.controls{
  display:flex;
  gap:10px;
}
.controls button{
  flex:1;
  font-size:.8rem;
  background:#ffffff;
  border:none;
  color:#000;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
}
.controls button:disabled{
  background:rgba(255,255,255,.4);
  cursor:not-allowed;
}

.settings{
  display:none;
  background:rgba(0,0,0,.18);
  border-radius:12px;
  padding:10px;
  font-size:.7rem;
}
.settings.active{display:grid}

.history{font-size:.7rem;color:var(--muted)}
</style>
</head>

<body>

<header>
  <img src="logo.png" class="logo">
</header>

<section class="grid" id="grid"></section>

<script>
/* ================= CONFIG ================= */
const TOTAL_TRAPS = 3;
const CAMERA_LIVE_DURATION = 20000;

/* ===== IP ESP32 ===== */
const MAIN_ESP_BASE = "http://10.153.210.142";
const STREAM_URL = MAIN_ESP_BASE + "/stream";
const LAST_IMAGE_URL = MAIN_ESP_BASE + "/last.jpg";

/* ===== FIREBASE ===== */
const FIREBASE_DB = "https://t-sonda-2-default-rtdb.firebaseio.com";

/* ================= FECHA FORMATEADA ================= */
function nowString(){
  const d = new Date();
  return d.toISOString().replace("T"," ").substring(0,19);
}

/* ================= FIREBASE ================= */
async function getTrapState(id){
  const res = await fetch(`${FIREBASE_DB}/traps/${id}.json`);
  return await res.json();
}

/* ================= STREAM ================= */
async function openLiveCamera(id, preview){

  const state = await getTrapState(id);
  if(state.online !== true){
    alert("Trampa dormida. Espere próximo evento.");
    return;
  }

  let s = CAMERA_LIVE_DURATION / 1000;

  preview.innerHTML = `
    <img src="${STREAM_URL}?t=${Date.now()}">
    <div class="overlay-time">${nowString()}</div>
  `;

  // actualizar hora cada segundo durante stream
  const clock = setInterval(()=>{
    const t = preview.querySelector(".overlay-time");
    if(t) t.textContent = nowString();
  },1000);

  setTimeout(()=>{
    clearInterval(clock);
    loadLastCapture(id, preview);
  }, CAMERA_LIVE_DURATION);
}

/* ================= ÚLTIMA CAPTURA ================= */
function loadLastCapture(id, preview){
  preview.innerHTML = `
    <img src="${LAST_IMAGE_URL}?t=${Date.now()}">
    <div class="overlay-time">${nowString()}</div>
  `;
}

/* ================= GENERAR TARJETAS (ESTRUCTURA ORIGINAL) ================= */
const grid = document.getElementById("grid");

for(let i=1;i<=TOTAL_TRAPS;i++){
  const card = document.createElement("div");
  card.className="card";

  card.innerHTML = `
    <div class="top-icons">
      <div class="wifi level-3" id="wifi${i}">
        <span></span><span></span><span></span>
      </div>
      <div class="module-toggle" id="toggle${i}"></div>
    </div>

    <h2>Trampa #${i}</h2>

    <div class="preview" id="preview${i}">
      <span>Sin imagen</span>
    </div>

    <div class="controls">
      <button id="cam${i}">📡 Cámara en vivo</button>
      <button id="set${i}">⚙️ Ajustes</button>
    </div>

    <div class="settings" id="settings${i}">
      <label>Zoom <input type="range"></label>
      <label>Brillo <input type="range"></label>
      <label>Contraste <input type="range"></label>
    </div>

    <div class="history">Estado sincronizado con Firebase</div>
  `;

  grid.appendChild(card);

  const camBtn = card.querySelector(`#cam${i}`);
  const preview = card.querySelector(`#preview${i}`);

  camBtn.onclick = ()=> openLiveCamera(i, preview);
}

/* ================= CARGA AL ABRIR ================= */
window.onload = async ()=>{
  const preview1 = document.getElementById("preview1");

  try{
    const state = await getTrapState(1);
    if(state.lastCapture === "OK"){
      loadLastCapture(1, preview1);
    }
  }catch(e){
    // queda última imagen visible
  }
};
</script>

</body>
</html>
