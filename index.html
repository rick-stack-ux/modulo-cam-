<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>IguanaLab | Trampas IoT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ============================================================
   TEMA (puedes cambiar data-theme en <body>)
   ============================================================ */
body[data-theme="dark"]{
  --bg:#081411;
  --card:#0f1f1a;
  --text:#e6f7f1;
  --muted:#7fbfa6;
  --accent:#39ff9c;
  --border:#1f3d32;
  --alert:#ffb020;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui, sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:20px;
}

/* HEADER */
header{
  display:flex;
  justify-content:center;
  margin-bottom:24px;
}
header img.logo{height:110px}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:16px;
}

/* CARD */
.card{
  position:relative;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* TOP ICONS */
.top-icons{
  position:absolute;
  top:12px;
  right:12px;
  display:flex;
  gap:10px;
}

/* WIFI */
.wifi{
  position:relative;
  width:18px;
  height:14px;
}
.wifi span{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  border:2px solid transparent;
  border-top-color:var(--accent);
  border-radius:50%;
  opacity:.25;
}
.wifi span:nth-child(1){width:6px;height:6px;opacity:1}
.wifi span:nth-child(2){width:12px;height:12px}
.wifi span:nth-child(3){width:18px;height:18px}
.wifi.level-3 span{opacity:1}

/* PREVIEW (ÚLTIMA CAPTURA / VIDEO) */
.preview{
  background:#020c09;
  border-radius:12px;
  height:140px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:.75rem;
  gap:6px;
  text-align:center;
}
.preview .title{
  font-weight:600;
}
.preview .status{
  color:var(--muted);
}

/* CONTROLES */
.controls{
  display:flex;
  gap:8px;
}
.controls button{
  flex:1;
  font-size:.75rem;
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px;
  border-radius:10px;
  cursor:pointer;
}

/* SETTINGS */
.settings{
  display:none;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:10px;
  padding:8px;
  font-size:.7rem;
  gap:6px;
}
.settings.active{display:grid}
.settings label{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
}
.settings input{width:60%}

/* HISTORIAL */
.history{
  font-size:.7rem;
  color:var(--muted);
}
</style>
</head>

<body data-theme="dark">

<header>
  <img src="logo.png" class="logo">
</header>

<section class="grid" id="grid"></section>

<script>
/* ============================================================
   CONFIGURACIÓN CÁMARA EN VIVO (EDITA SOLO AQUÍ)
   ============================================================ */
const CAMERA_DAILY_LIMIT = 2;        // veces por día
const CAMERA_LIVE_DURATION = 20000;  // ms (20 s)

/* ============================================================
   CONTROL DE USO DIARIO
   ============================================================ */
function todayKey(){
  const d = new Date().toISOString().slice(0,10);
  return "camera_views_" + d;
}

function getViews(){
  return parseInt(localStorage.getItem(todayKey())) || 0;
}

function addView(){
  localStorage.setItem(todayKey(), getViews()+1);
}

/* ============================================================
   CÁMARA EN VIVO (SIMULADA)
   ============================================================ */
function openLiveCamera(preview){
  if(getViews() >= CAMERA_DAILY_LIMIT){
    alert("Límite diario de cámara en vivo alcanzado.");
    return;
  }

  addView();

  const original = preview.innerHTML;
  let seconds = CAMERA_LIVE_DURATION / 1000;

  preview.innerHTML = `
    <div class="title">📡 Cámara en vivo</div>
    <div class="status">Transmitiendo… (${seconds}s)</div>
  `;

  const countdown = setInterval(()=>{
    seconds--;
    const status = preview.querySelector(".status");
    if(status) status.textContent = `Transmitiendo… (${seconds}s)`;
  },1000);

  setTimeout(()=>{
    clearInterval(countdown);
    preview.innerHTML = original;
  }, CAMERA_LIVE_DURATION);
}

/* ============================================================
   GENERAR TRAMPAS
   ============================================================ */
const grid = document.getElementById("grid");

for(let i=0;i<3;i++){
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <div class="top-icons">
      <div class="wifi level-3">
        <span></span><span></span><span></span>
      </div>
    </div>

    <h2>Trampa #${i+1}</h2>

    <div class="preview">
      <div class="title">Última captura</div>
      <div class="status">Sin imagen</div>
    </div>

    <div class="controls">
      <button onclick="openLiveCamera(this.closest('.card').querySelector('.preview'))">
        📷 Cámara
      </button>
      <button onclick="toggleSettings(${i})">⚙️ Ajustes</button>
    </div>

    <div class="settings" id="settings${i}">
      <label>Zoom <input type="range"></label>
      <label>Brillo <input type="range"></label>
      <label>Contraste <input type="range"></label>
    </div>

    <div class="history">Último evento: Hace minutos</div>
  `;

  grid.appendChild(card);
}

function toggleSettings(i){
  document.getElementById("settings"+i).classList.toggle("active");
}
</script>

</body>
</html>
