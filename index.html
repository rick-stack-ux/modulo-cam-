<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>IguanaLab | Trampas IoT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ================= VARIABLES BASE ================= */
:root{
  --bg: linear-gradient(135deg,#5bc0eb,#9bcf9b);
  --card: rgba(255,255,255,0.14);
  --text: #ffffff;
  --muted: rgba(255,255,255,0.75);
  --accent: #ffffff;
  --border: rgba(255,255,255,0.30);
  --shadow: 0 20px 40px rgba(0,0,0,.25);
}

/* ================= BASE ================= */
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  font-family:system-ui, sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:20px;
}

/* HEADER */
header{
  display:flex;
  justify-content:center;
  margin-bottom:24px;
}
header img.logo{height:110px}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
}

/* CARD (GLASS) */
.card{
  position:relative;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:var(--shadow);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

/* TOP ICONS */
.top-icons{
  position:absolute;
  top:12px;
  right:12px;
}

/* WIFI ICON */
.wifi{
  position:relative;
  width:18px;
  height:14px;
}
.wifi span{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  border:2px solid transparent;
  border-top-color:var(--accent);
  border-radius:50%;
  opacity:.25;
}
.wifi span:nth-child(1){width:6px;height:6px;opacity:1}
.wifi span:nth-child(2){width:12px;height:12px}
.wifi span:nth-child(3){width:18px;height:18px}
.wifi.level-3 span{opacity:1}

/* PREVIEW */
.preview{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.20);
  border-radius:14px;
  height:140px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:.75rem;
  gap:6px;
  text-align:center;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

/* CONTROLES */
.controls{
  display:flex;
  gap:8px;
}
.controls button{
  flex:1;
  font-size:.75rem;
  background:rgba(255,255,255,0.18);
  border:1px solid rgba(255,255,255,0.35);
  color:#fff;
  padding:8px;
  border-radius:12px;
  cursor:pointer;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

/* SETTINGS */
.settings{
  display:none;
  background:rgba(255,255,255,0.10);
  border:1px solid rgba(255,255,255,0.25);
  border-radius:12px;
  padding:8px;
  font-size:.7rem;
  gap:6px;
  backdrop-filter: blur(10px);
}
.settings.active{display:grid}
.settings label{
  display:flex;
  justify-content:space-between;
}

/* HISTORIAL */
.history{
  font-size:.7rem;
  color:var(--muted);
}
</style>
</head>

<body>

<header>
  <img src="logo.png" class="logo">
</header>

<section class="grid" id="grid"></section>

<script>
/* ============================================================
   CONFIGURACIÓN RÁPIDA
   ============================================================ */
const UI_THEME = 1;              // 👈 CAMBIA 1–10
const CAMERA_DAILY_LIMIT = 2;
const CAMERA_LIVE_DURATION = 20000;

/* ============================================================
   TEMAS GLASS / GRADIENT (1–10)
   ============================================================ */
const UI_THEMES = {
  1:{ bg:"linear-gradient(135deg,#5bc0eb,#9bcf9b)", card:"rgba(255,255,255,0.14)", muted:"rgba(255,255,255,.75)" },
  2:{ bg:"linear-gradient(135deg,#4facfe,#00f2fe)", card:"rgba(255,255,255,0.15)", muted:"rgba(255,255,255,.70)" },
  3:{ bg:"linear-gradient(135deg,#84fab0,#8fd3f4)", card:"rgba(255,255,255,0.16)", muted:"rgba(255,255,255,.75)" },
  4:{ bg:"linear-gradient(135deg,#667eea,#764ba2)", card:"rgba(255,255,255,0.13)", muted:"rgba(255,255,255,.70)" },
  5:{ bg:"linear-gradient(135deg,#43cea2,#185a9d)", card:"rgba(255,255,255,0.14)", muted:"rgba(255,255,255,.72)" },
  6:{ bg:"linear-gradient(135deg,#a18cd1,#fbc2eb)", card:"rgba(255,255,255,0.15)", muted:"rgba(255,255,255,.75)" },
  7:{ bg:"linear-gradient(135deg,#ff9a9e,#fad0c4)", card:"rgba(255,255,255,0.16)", muted:"rgba(255,255,255,.75)" },
  8:{ bg:"linear-gradient(135deg,#141e30,#243b55)", card:"rgba(255,255,255,0.10)", muted:"rgba(255,255,255,.65)" },
  9:{ bg:"linear-gradient(135deg,#134e5e,#71b280)", card:"rgba(255,255,255,0.13)", muted:"rgba(255,255,255,.70)" },
 10:{ bg:"linear-gradient(135deg,#2c3e50,#4ca1af)", card:"rgba(255,255,255,0.12)", muted:"rgba(255,255,255,.70)" }
};

/* ============================================================
   APLICAR TEMA
   ============================================================ */
const t = UI_THEMES[UI_THEME];
document.body.style.background = t.bg;
document.documentElement.style.setProperty("--card", t.card);
document.documentElement.style.setProperty("--muted", t.muted);

/* ============================================================
   CÁMARA EN VIVO (SIMULADA)
   ============================================================ */
function todayKey(){
  return "views_" + new Date().toISOString().slice(0,10);
}
function getViews(){
  return parseInt(localStorage.getItem(todayKey())) || 0;
}
function addView(){
  localStorage.setItem(todayKey(), getViews()+1);
}

function openLiveCamera(preview){
  if(getViews() >= CAMERA_DAILY_LIMIT){
    alert("Límite diario de cámara alcanzado");
    return;
  }
  addView();

  const original = preview.innerHTML;
  let s = CAMERA_LIVE_DURATION / 1000;

  preview.innerHTML = `<b>📡 Cámara en vivo</b><span>${s}s</span>`;

  const i = setInterval(()=>{
    s--;
    preview.querySelector("span").textContent = `${s}s`;
  },1000);

  setTimeout(()=>{
    clearInterval(i);
    preview.innerHTML = original;
  }, CAMERA_LIVE_DURATION);
}

/* ============================================================
   GENERAR TARJETAS
   ============================================================ */
const grid = document.getElementById("grid");

for(let i=0;i<3;i++){
  const card = document.createElement("div");
  card.className="card";

  card.innerHTML = `
    <div class="top-icons">
      <div class="wifi level-3">
        <span></span><span></span><span></span>
      </div>
    </div>

    <h2>Trampa #${i+1}</h2>

    <div class="preview">
      <b>Última captura</b>
      <span>Sin imagen</span>
    </div>

    <div class="controls">
      <button onclick="openLiveCamera(this.closest('.card').querySelector('.preview'))">
        📷 Cámara
      </button>
      <button onclick="toggleSettings(${i})">⚙️ Ajustes</button>
    </div>

    <div class="settings" id="settings${i}">
      <label>Zoom <input type="range"></label>
      <label>Brillo <input type="range"></label>
    </div>

    <div class="history">Último evento: Hace minutos</div>
  `;
  grid.appendChild(card);
}

function toggleSettings(i){
  document.getElementById("settings"+i).classList.toggle("active");
}
</script>

</body>
</html>
